# Coverage matrix: every user-facing feature and the tests that cover it.
# Checked by CoverageMatrixTest (./gradlew :desktop:test --tests "*CoverageMatrixTest").
# How to add a row: desktop/TESTING.md.
#
# tier: the cheapest UI-level tier that covers the key today (smoke, then journey); unit when
# only unit tests cover it; for an empty tests list, the tier the planned test will have.
# gap: why nothing (or not all of it) is covered yet, and where the missing test comes from.
# The gated -Pzoukan.e2e EndToEnd tests never run in CI, so they are not listed as coverage.

# --- App shell, window and global ---

# The smoke test renders these two under every check, but no check is keyed to them
- key: screen:HomeScreen
  feature: "Main window, navigation rail with 5 tabs"
  tier: smoke
  smoke: false
  tests: [ui.ScreenSmokeTest]

- key: state:shell
  feature: "Window content: theme, snackbar messages, mouse Back button"
  tier: smoke
  smoke: false
  tests: [ui.ScreenSmokeTest]

- key: flow:shell.window-bounds
  feature: "Window size and position restored, minimum 800x560"
  tier: unit
  smoke: false
  tests: [ui.common.WindowBoundsTest]
  gap: "manual: the Window's size and position are OS-level (set on the Window, not in ZoukanContent); the restore logic is unit tested"

- key: flow:shell.tray
  feature: "Tray icon: open, update library, pause/start downloads, quit; close to tray"
  tier: manual
  smoke: false
  tests: []
  gap: "manual: the system tray is OS-level and cannot be driven from a Compose UI test"

