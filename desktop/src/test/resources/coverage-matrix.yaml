  tests: [ui.ShortcutsTest, ui.ShortcutsBackGuardTest, ui.HomeTabSelectionTest, e2e.KeyboardShortcutsJourneyTest, e2e.MigrationBackGuardJourneyTest]

- key: flow:shell.theme
