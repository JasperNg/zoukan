# Zoukan (desktop) dependencies, kept apart from the upstream catalogs so upstream merges stay easy.
# Versions of the Android compatibility layer follow Suwayomi-Server at d5215280.

[versions]
graalvm = "25.4.4.1.1"
twelvemonkeys = "3.15.3"
dex2jar = "2.4.38"
asm = "9.9.1"
jcef = "jcef-17e805a+cef-152.0.6+g708dc14+chromium-152.0.7977.83"
jcefmaven = "152.0.6"
multiplatform-settings = "1.3.0"
compose-multiplatform = "1.12.2"
compose-material3 = "1.12.0-alpha03"
compose-material-icons = "1.7.3"

[libraries]
# Android API for the desktop runtime: android.jar with the classes AndroidCompat replaces taken out
android-jar = "com.github.Suwayomi:android-jar:1.0.0"
xmlpull = "xmlpull:xmlpull:1.1.3.4a"
androidx-annotation = "androidx.annotation:annotation:1.11.0"

slf4j-api = "org.slf4j:slf4j-api:2.0.20"
logback-classic = "ch.qos.logback:logback-classic:1.6.6"
kotlin-logging = "io.github.oshai:kotlin-logging-jvm:8.0.6"
appdirs = "ca.gosyer:kotlin-multiplatform-appdirs:2.0.0"
typesafe-config = "com.typesafe:config:1.4.10"
config4k = "io.github.config4k:config4k:0.7.0"
jackson-annotations = "com.fasterxml.jackson.core:jackson-annotations:2.22"
multiplatform-settings-jvm = { module = "com.russhwolf:multiplatform-settings-jvm", version.ref = "multiplatform-settings" }
multiplatform-settings-serialization-jvm = { module = "com.russhwolf:multiplatform-settings-serialization-jvm", version.ref = "multiplatform-settings" }
icu4j = "com.ibm.icu:icu4j:79.1"
graalvm-polyglot = { module = "org.graalvm.polyglot:polyglot", version.ref = "graalvm" }
graalvm-js = { module = "org.graalvm.polyglot:js-community", version.ref = "graalvm" }
twelvemonkeys-common-lang = { module = "com.twelvemonkeys.common:common-lang", version.ref = "twelvemonkeys" }
twelvemonkeys-common-io = { module = "com.twelvemonkeys.common:common-io", version.ref = "twelvemonkeys" }
twelvemonkeys-common-image = { module = "com.twelvemonkeys.common:common-image", version.ref = "twelvemonkeys" }
twelvemonkeys-imageio-core = { module = "com.twelvemonkeys.imageio:imageio-core", version.ref = "twelvemonkeys" }
twelvemonkeys-imageio-metadata = { module = "com.twelvemonkeys.imageio:imageio-metadata", version.ref = "twelvemonkeys" }
twelvemonkeys-imageio-jpeg = { module = "com.twelvemonkeys.imageio:imageio-jpeg", version.ref = "twelvemonkeys" }
twelvemonkeys-imageio-webp = { module = "com.twelvemonkeys.imageio:imageio-webp", version.ref = "twelvemonkeys" }
webp-imageio = "com.github.usefulness:webp-imageio:0.11.0"

# Built-in browser: JCEF with Chromium natives from Maven Central
jcefmaven = { module = "me.friwi:jcefmaven", version.ref = "jcefmaven" }
jcef-api = { module = "me.friwi:jcef-api", version.ref = "jcef" }

# Libraries extensions expect from the host
okhttp-zstd = "com.squareup.okhttp3:okhttp-zstd:5.3.2"
bouncycastle = "org.bouncycastle:bcprov-jdk18on:1.86"

# Extension install pipeline
apk-parser = "net.dongliu:apk-parser:2.6.10"
apksig = "com.android.tools.build:apksig:9.5.1"
dex2jar-translator = { module = "de.femtopedia.dex2jar:dex-translator", version.ref = "dex2jar" }
dex2jar-tools = { module = "de.femtopedia.dex2jar:dex-tools", version.ref = "dex2jar" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
asm-analysis = { module = "org.ow2.asm:asm-analysis", version.ref = "asm" }

# Encrypted database: sqlite-jdbc built with SQLite3MultipleCiphers, SQLDelight's JDBC driver
sqlite-jdbc-crypt = "io.github.willena:sqlite-jdbc:3.53.4.0"
sqldelight-jvm-driver = "app.cash.sqldelight:sqlite-driver:2.3.2"

# CBZ downloads, including password-protected (AES) ones, and the local source's archives
zip4j = "net.lingala.zip4j:zip4j:2.11.5"
# The local source's RAR (v4), 7z and TAR chapters; xz has the LZMA decoders 7z needs
commons-compress = "org.apache.commons:commons-compress:1.28.0"
xz = "org.tukaani:xz:1.12"
junrar = "com.github.junrar:junrar:7.5.10"

# OS secret store (Windows Credential Manager, macOS Keychain)
jna = "net.java.dev.jna:jna:5.19.1"
jna-platform = "net.java.dev.jna:jna-platform:5.19.1"

# Desktop UI: Compose Multiplatform (the desktop runtime artifact is picked per OS in desktop/build.gradle.kts)
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-util = { module = "org.jetbrains.compose.ui:ui-util", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-material-icons = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-material-icons" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
coroutines-swing = "org.jetbrains.kotlinx:kotlinx-coroutines-swing:1.11.0"

[bundles]
twelvemonkeys = [
    "twelvemonkeys-common-lang", "twelvemonkeys-common-io", "twelvemonkeys-common-image",
    "twelvemonkeys-imageio-core", "twelvemonkeys-imageio-metadata", "twelvemonkeys-imageio-jpeg",
    "twelvemonkeys-imageio-webp",
]
