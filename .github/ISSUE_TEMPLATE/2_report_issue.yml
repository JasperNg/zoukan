name: 🐞 Issue report
description: Report an issue in Zoukan
labels: [bug]
body:
  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: Provide an example of the issue.
      placeholder: |
        Example:
          1. First step
          2. Second step
          3. Issue here
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what you should expect to happen.
      placeholder: |
        Example:
          "This should happen..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Explain what actually happens.
      placeholder: |
        Example:
          "This happened instead..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log and crash reports
      description: |
        Settings → About → **Open the log folder** has `zoukan.log`; **Crash logs** beside it opens the crash reports. Attach the ones from around the time of the issue.
      placeholder: |
        Upload the files as attachments, or paste the relevant part in plain text.

  - type: input
    id: zoukan-version
    attributes:
      label: Zoukan version
      description: You can find it in **Settings → About**.
      placeholder: |
        Example: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x64
        - macOS (Apple Silicon)
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: |
        Example: "Windows 11 24H2" or "macOS 15.1"
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Additional details and attachments.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Read this carefully, we will close and ignore your issue if you skimmed through this.
      options:
        - label: I have searched the existing issues and this is a new ticket, **NOT** a duplicate or related to another open or closed issue.
          required: true
        - label: I have written a short but informative title.
          required: true
        - label: I have updated the app to version **[latest](https://github.com/JasperNg/zoukan/releases/latest)**.
          required: true
        - label: I have filled out all of the requested information in this form, including specific version numbers.
          required: true
        - label: I understand that **Zoukan does not have or fix any extensions**, and I **will not receive help** for any issues related to sources or extensions.
          required: true
