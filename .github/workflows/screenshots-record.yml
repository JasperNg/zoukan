# Records or verifies the screenshot goldens: about 20 curated screens in light and dark, at the
# default and the smallest window (desktop/src/test/screenshots/linux/<size>-<theme>/<key>.png).
#
# Goldens are per operating system and only Linux compares them (fonts and the rasteriser differ
# elsewhere), so they are recorded here, on ubuntu-24.04 under xvfb with pinned fonts, never on a
# developer machine. After an intended visual change:
#   gh workflow run screenshots-record.yml --ref <branch>                   (mode: record)
# then download the "screenshot-goldens" artifact into desktop/src/test/screenshots and commit it.
#   gh workflow run screenshots-record.yml --ref <branch> -f mode=verify    (compare; the nightly job does this)
# A failed verify uploads build/reports/screenshots: expected.png, actual.png and diff.png per screen.
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'record writes the goldens and uploads them; verify compares with the committed ones'
        type: choice
        options: [record, verify]
        default: record

permissions:
  contents: read

jobs:
  screenshots:
    name: Screenshots (${{ inputs.mode }})
    # Pinned: a newer image can change fonts and the rasteriser, and so every golden
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The JetBrains Runtime from JetBrains' own CDN, as ci.yml does
      - name: Download JetBrains Runtime
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/jbrsdk-21.0.11-linux-x64-b1163.125.tar.gz" "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-21.0.11-linux-x64-b1163.125.tar.gz"
          # Pinned SHA-512 of this exact JetBrains Runtime build; change it together with the URL.
          echo "690fbea6224aeb57478f98ad56671fdbb6e927b3513555e78088f276552c554fe672705e9c6da4a65ed8279846f42e0756bae539d8282bee01f78d2fd68f846a  jbrsdk-21.0.11-linux-x64-b1163.125.tar.gz" | sha512sum -c -

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/jbrsdk-21.0.11-linux-x64-b1163.125.tar.gz
          java-version: 21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true

      # Installed explicitly rather than relying on the runner image, so the glyphs (CJK titles
      # included) are the same in every run
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk
          fc-cache -f

      - name: Screenshots
        run: xvfb-run -a ./gradlew :desktop:wiringTest -Pzoukan.screenshots=${{ inputs.mode }}

      - name: Upload goldens
        if: ${{ (inputs.mode) == 'record' && always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: screenshot-goldens
          path: desktop/src/test/screenshots/
          if-no-files-found: error

      - name: Upload screenshot reports
        if: ${{ (inputs.mode) == 'verify' && failure() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: screenshot-reports
          path: desktop/build/reports/screenshots/
          if-no-files-found: ignore
