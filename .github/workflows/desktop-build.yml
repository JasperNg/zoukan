# Builds the Zoukan desktop installers on GitHub's hosted runners after every merge to master:
# the Windows x64 MSI and the Apple Silicon DMG, uploaded as build artifacts on the run's page.
#
# This is an extra next to the local checks (desktop/RELEASING.md); it does not gate merges.
# The installers are unsigned on purpose: the project does not sign its builds.
name: Desktop installers

on:
  push:
    branches: [master]
  pull_request:
    paths: [.github/workflows/desktop-build.yml]
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 MSI
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The installer bundles a runtime made with jlink from this JDK, so it must be a full JDK 21
      # with jmods: JetBrains Runtime, the plan's choice
      # setup-java's jetbrains distribution looks the release up through the GitHub API without a
      # token, which the shared hosted-runner IPs often hit the rate limit on. Download a pinned
      # JetBrains Runtime from JetBrains' own CDN instead and hand it to setup-java as a local file.
      - name: Download JetBrains Runtime
        shell: bash
        run: curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/jbrsdk-21.0.11-windows-x64-b1163.125.zip" "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-21.0.11-windows-x64-b1163.125.zip"

      - uses: actions/setup-java@v5
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/jbrsdk-21.0.11-windows-x64-b1163.125.zip
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the MSI
        shell: pwsh
        run: .\gradlew.bat :desktop:packageMsi

      - uses: actions/upload-artifact@v5
        with:
          name: zoukan-windows-x64
          path: desktop/build/packaging/installers/*.msi
          if-no-files-found: error

  macos:
    name: macOS arm64 DMG
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # setup-java's jetbrains distribution looks the release up through the GitHub API without a
      # token, which the shared hosted-runner IPs often hit the rate limit on. Download a pinned
      # JetBrains Runtime from JetBrains' own CDN instead and hand it to setup-java as a local file.
      - name: Download JetBrains Runtime
        shell: bash
        run: curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/jbrsdk-21.0.11-osx-aarch64-b1163.125.tar.gz" "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-21.0.11-osx-aarch64-b1163.125.tar.gz"

      - uses: actions/setup-java@v5
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/jbrsdk-21.0.11-osx-aarch64-b1163.125.tar.gz
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the DMG
        run: ./gradlew :desktop:packageDmg

      - uses: actions/upload-artifact@v5
        with:
          name: zoukan-macos-arm64
          path: desktop/build/packaging/installers/*.dmg
          if-no-files-found: error
