# Builds the Zoukan desktop installers on GitHub's hosted runners after every merge to master, the
# Windows x64 MSI and the Apple Silicon DMG, and publishes them as a GitHub release, which the
# in-app update check finds (tag desktop-v<version>).
#
# Each release bumps PATCH over the newest desktop-v* tag. zoukanVersion in desktop/build.gradle.kts
# is the floor: raise it there for a new MINOR or MAJOR and the next merge releases that version.
# The installers are unsigned on purpose: the project does not sign its builds.
# Before anything is published, each job starts the packaged app (`Zoukan selftest --ui`), so a
# build that crashes on startup is never released. The release is also published only after the
# CI check (ci.yml, called as the tests job) passed on the same commit.
name: Desktop installers

on:
  # Merges that only change docs skip the build and the release, the same list as ci.yml
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/readme-images/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'desktop/reports/**'
      - 'LICENSE'
  pull_request:
    paths: [.github/workflows/desktop-build.yml]
  workflow_dispatch:

# Pull requests cancel their older runs. Runs on master queue instead, so each release sees the
# tag of the one before it and no two releases pick the same version.
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The installers build beside the tests; only publishing waits for them
  tests:
    name: Tests of this commit
    uses: ./.github/workflows/ci.yml

  version:
    name: Pick the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          floor=$(sed -nE 's/^[[:space:]]*\?: "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' desktop/build.gradle.kts | head -n1)
          [ -n "$floor" ] || { echo "No zoukanVersion found in desktop/build.gradle.kts"; exit 1; }
          latest=$(git tag --list 'desktop-v*' | sed 's/^desktop-v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -z "$latest" ]; then
            version=$floor
          else
            IFS=. read -r major minor patch <<< "$latest"
            next="$major.$minor.$((patch + 1))"
            # The floor wins when it is above the newest release (a MINOR or MAJOR raise)
            version=$(printf '%s\n%s\n' "$next" "$floor" | sort -V | tail -n1)
          fi
          # Publish from master only, and only once per commit (a re-run of a released commit
          # rebuilds without releasing again)
          release=false
          if [ "$GITHUB_REF" = refs/heads/master ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            if [ -z "$(git tag --points-at HEAD --list 'desktop-v*')" ]; then release=true; fi
          fi
          echo "Newest release: ${latest:-none}, floor: $floor, this build: $version, publish: $release"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64 MSI
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The installer bundles a runtime made with jlink from this JDK, so it must be a full JDK 21
      # with jmods: JetBrains Runtime, the plan's choice
      # setup-java's jetbrains distribution looks the release up through the GitHub API without a
      # token, which the shared hosted-runner IPs often hit the rate limit on. Download a pinned
      # JetBrains Runtime from JetBrains' own CDN instead and hand it to setup-java as a local file.
      - name: Download JetBrains Runtime
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/jbrsdk-21.0.11-windows-x64-b1163.125.zip" "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-21.0.11-windows-x64-b1163.125.zip"
          # Pinned SHA-512 of this exact JetBrains Runtime build; change it together with the URL.
          echo "9d244c480cc3b5b77c06753ad8f32e2f40ded94ee02fc3ff6c2bee06fac3d5f1cc42cb1f7b7fa8f8a6e0b14a7dafa2451cd2781d6d5f1c2f598c511f53e2ffe9  jbrsdk-21.0.11-windows-x64-b1163.125.zip" | sha512sum -c -

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/jbrsdk-21.0.11-windows-x64-b1163.125.zip
          java-version: 21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Build the MSI
        shell: pwsh
        run: .\gradlew.bat :desktop:packageMsi "-Pzoukan.version=${{ needs.version.outputs.version }}"

      # Start the packaged app (the folder the MSI installs) before it can be released: its
      # self-test starts the runtime in a throwaway profile, opens the encrypted database, loads
      # extensions and draws the main window, so a build that crashes on startup fails here.
      # The launcher has no console on Windows, so the result comes from the report and exit code.
      - name: Start the packaged app
        shell: pwsh
        timeout-minutes: 10
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest-windows.md"
          $app = Start-Process -FilePath "desktop\build\packaging\app\Zoukan\Zoukan.exe" `
            -ArgumentList "selftest", "--ui", "--report", "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report } else { Write-Host "No self-test report was written" }
          if ($app.ExitCode -ne 0) { Write-Error "The packaged app's self-test failed (exit code $($app.ExitCode))"; exit 1 }

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: zoukan-windows-x64
          path: desktop/build/packaging/installers/*.msi
          if-no-files-found: error

  macos:
    name: macOS arm64 DMG
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # setup-java's jetbrains distribution looks the release up through the GitHub API without a
      # token, which the shared hosted-runner IPs often hit the rate limit on. Download a pinned
      # JetBrains Runtime from JetBrains' own CDN instead and hand it to setup-java as a local file.
      - name: Download JetBrains Runtime
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/jbrsdk-21.0.11-osx-aarch64-b1163.125.tar.gz" "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-21.0.11-osx-aarch64-b1163.125.tar.gz"
          # Pinned SHA-512 of this exact JetBrains Runtime build; change it together with the URL.
          echo "4b2769d097547b70df3cd8ff49d137579acb7fea874419052ec3450565665dc3262caa9a7a9f7e9ca611fd02650eb002845b3cd029cebc300eb00dd00ef45c43  jbrsdk-21.0.11-osx-aarch64-b1163.125.tar.gz" | shasum -a 512 -c -

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/jbrsdk-21.0.11-osx-aarch64-b1163.125.tar.gz
          java-version: 21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Build the DMG
        run: ./gradlew :desktop:packageDmg "-Pzoukan.version=${{ needs.version.outputs.version }}"

      # Start the packaged app (the one inside the DMG) before it can be released, as on Windows
      - name: Start the packaged app
        timeout-minutes: 10
        run: |
          report="$RUNNER_TEMP/selftest-macos.md"
          status=0
          desktop/build/packaging/app/Zoukan.app/Contents/MacOS/Zoukan selftest --ui --report "$report" || status=$?
          if [ "$status" -ne 0 ]; then
            [ -f "$report" ] || echo "No self-test report was written"
            echo "::error::The packaged app's self-test failed (exit code $status)"
            exit 1
          fi

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: zoukan-macos-arm64
          path: desktop/build/packaging/installers/*.dmg
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [version, tests, windows, macos]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: installers
          merge-multiple: true

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -l installers
          previous=$(git tag --list 'desktop-v*' | sed 's/^desktop-v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          cat > notes.md <<'EOF'
          Built by GitHub Actions from the merge to master.

          Both installers are unsigned: Windows SmartScreen may warn about an unknown publisher (More info > Run anyway), and on macOS the first start needs System Settings > Privacy & Security > Open Anyway.
          EOF
          args=(--target "$GITHUB_SHA" --title "Zoukan $VERSION" --notes-file notes.md --generate-notes --latest)
          if [ -n "$previous" ]; then args+=(--notes-start-tag "desktop-v$previous"); fi
          gh release create "desktop-v$VERSION" installers/*.msi installers/*.dmg "${args[@]}"
