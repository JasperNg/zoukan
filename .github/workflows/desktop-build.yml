# Builds the Zoukan desktop installers on GitHub's hosted runners after every merge to master, the
# Windows x64 MSI and the Apple Silicon DMG, and publishes them as a GitHub release, which the
# in-app update check finds (tag desktop-v<version>).
#
# Each release bumps PATCH over the newest desktop-v* tag. zoukan.versionFloor in gradle.properties
# is the floor: raise it there for a new MINOR or MAJOR and the next merge releases that version.
# The installers are unsigned on purpose: the project does not sign its builds.
# Before anything is published, each job installs the installer it built (the MSI, or the app
# copied out of the mounted DMG) and runs the installed app's self-test, so an installer that
# fails to install or an app that crashes on startup is never released. The release is also published only after the
# CI check (ci.yml, called as the tests job) passed on the same commit.
name: Desktop installers

on:
  # Merges that only change docs skip the build and the release, the same list as ci.yml
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/readme-images/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'desktop/reports/**'
      - 'LICENSE'
  pull_request:
    paths:
      - .github/workflows/desktop-build.yml
      - desktop/packaging/**
      - desktop/packaging.gradle.kts
  workflow_dispatch:

# Pull requests cancel their older runs. Runs on master queue instead, so each release sees the
# tag of the one before it and no two releases pick the same version. GitHub keeps one waiting run
# per group: a newer merge replaces a waiting run, and that commit ships in the next release.
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The installers build beside the tests; only publishing waits for them
  tests:
    name: Tests of this commit
    uses: ./.github/workflows/ci.yml

  version:
    name: Pick the version
    # A fixed image version: move it on purpose, together with RELEASING.md
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          floor=$(sed -nE 's/^zoukan\.versionFloor=([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' gradle.properties)
          if [ "$(printf '%s' "$floor" | grep -c '^')" != 1 ]; then
            echo "::error::gradle.properties must hold exactly one zoukan.versionFloor=MAJOR.MINOR.PATCH line (found: '$floor')"
            exit 1
          fi
          echo "Version floor from gradle.properties: $floor"
          latest=$(git tag --list 'desktop-v*' | sed 's/^desktop-v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -z "$latest" ]; then
            version=$floor
          else
            IFS=. read -r major minor patch <<< "$latest"
            next="$major.$minor.$((patch + 1))"
            # The floor wins when it is above the newest release (a MINOR or MAJOR raise)
            version=$(printf '%s\n%s\n' "$next" "$floor" | sort -V | tail -n1)
          fi
          # Publish from master only, and only once per commit (a re-run of a released commit
          # rebuilds without releasing again)
          release=false
          if [ "$GITHUB_REF" = refs/heads/master ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            if [ -z "$(git tag --points-at HEAD --list 'desktop-v*')" ]; then release=true; fi
          fi
          echo "Newest release: ${latest:-none}, floor: $floor, this build: $version, publish: $release"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64 MSI
    needs: version
    # A fixed image version: move it on purpose, together with RELEASING.md
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The installer bundles a runtime made with jlink from this JDK, so it must be a full JDK 21
      # with jmods: JetBrains Runtime, the plan's choice
      # setup-java's jetbrains distribution looks the release up through the GitHub API without a
      # token, which the shared hosted-runner IPs often hit the rate limit on. Download a pinned
      # JetBrains Runtime from JetBrains' own CDN instead and hand it to setup-java as a local file.
      - name: Download JetBrains Runtime
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/jbrsdk-21.0.11-windows-x64-b1163.125.zip" "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-21.0.11-windows-x64-b1163.125.zip"
          # Pinned SHA-512 of this exact JetBrains Runtime build; change it together with the URL.
          echo "9d244c480cc3b5b77c06753ad8f32e2f40ded94ee02fc3ff6c2bee06fac3d5f1cc42cb1f7b7fa8f8a6e0b14a7dafa2451cd2781d6d5f1c2f598c511f53e2ffe9  jbrsdk-21.0.11-windows-x64-b1163.125.zip" | sha512sum -c -

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: jdkfile
          jdk-file: ${{ runner.temp }}/jbrsdk-21.0.11-windows-x64-b1163.125.zip
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the MSI
        shell: pwsh
        run: .\gradlew.bat :desktop:packageMsi "-Pzoukan.version=${{ needs.version.outputs.version }}"

      # Install the MSI it will publish (per user, silently) and run the installed app's self-test
      # (throwaway profile, database, extensions, main window, network), then uninstall. A broken
      # installer or a build that crashes on startup fails here and is never released.
      - name: Install the MSI and start the installed app
        shell: pwsh
        timeout-minutes: 15
        env:
          # The self-test's update check uses it for its own rate limit; never printed
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & desktop\packaging\check\install-check-windows.ps1 -SkipBuild
          if ($LASTEXITCODE -ne 0) { Write-Error "The installed app's check failed"; exit 1 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: install-check-windows
          path: desktop/build/reports/install/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zoukan-windows-x64
          path: desktop/build/packaging/installers/*.msi
          if-no-files-found: error

  macos:
    name: macOS arm64 DMG
    needs: version
    # A fixed image version: move it on purpose, together with RELEASING.md
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-java's jetbrains distribution looks the release up through the GitHub API without a
      # token, which the shared hosted-runner IPs often hit the rate limit on. Download a pinned
      # JetBrains Runtime from JetBrains' own CDN instead and hand it to setup-java as a local file.
      - name: Download JetBrains Runtime
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/jbrsdk-21.0.11-osx-aarch64-b1163.125.tar.gz" "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-21.0.11-osx-aarch64-b1163.125.tar.gz"
          # Pinned SHA-512 of this exact JetBrains Runtime build; change it together with the URL.
          echo "4b2769d097547b70df3cd8ff49d137579acb7fea874419052ec3450565665dc3262caa9a7a9f7e9ca611fd02650eb002845b3cd029cebc300eb00dd00ef45c43  jbrsdk-21.0.11-osx-aarch64-b1163.125.tar.gz" | shasum -a 512 -c -

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: jdkfile
          jdk-file: ${{ runner.temp }}/jbrsdk-21.0.11-osx-aarch64-b1163.125.tar.gz
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the DMG
        run: ./gradlew :desktop:packageDmg "-Pzoukan.version=${{ needs.version.outputs.version }}"

      # Mount the DMG it will publish, copy the app out and run its self-test, as on Windows
      - name: Mount the DMG and start the app from it
        timeout-minutes: 15
        env:
          # The self-test's update check uses it for its own rate limit; never printed
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: desktop/packaging/check/install-check-macos.sh --skip-build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: install-check-macos
          path: desktop/build/reports/install/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zoukan-macos-arm64
          path: desktop/build/packaging/installers/*.dmg
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [version, tests, windows, macos]
    if: needs.version.outputs.release == 'true'
    # A fixed image version: move it on purpose, together with RELEASING.md
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          ZOUKAN_RELEASE_SIGNING_KEY: ${{ secrets.ZOUKAN_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          ls -l installers
          # Every installer gets a detached Ed25519 signature that the app checks; with no key
          # nothing is published, so an unsigned release cannot go out
          [ -n "$ZOUKAN_RELEASE_SIGNING_KEY" ] || { echo "release signing key missing"; exit 1; }
          umask 077
          # The private key is removed even when signing or checking fails
          trap 'rm -f "$RUNNER_TEMP/release-key.pem"' EXIT
          printf '%s\n' "$ZOUKAN_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-key.pem"
          for f in installers/*.msi installers/*.dmg; do
            name=$(basename "$f")
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            printf 'zoukan-release-v1\n%s\n%s\n' "$name" "$sum" > "$RUNNER_TEMP/statement"
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release-key.pem" -rawin -in "$RUNNER_TEMP/statement" -out "$f.sig"
            openssl pkeyutl -verify -pubin -inkey desktop/src/main/resources/zoukan-release-key.pem -rawin -in "$RUNNER_TEMP/statement" -sigfile "$f.sig"
          done
          rm -f "$RUNNER_TEMP/release-key.pem"
          previous=$(git tag --list 'desktop-v*' | sed 's/^desktop-v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          cat > notes.md <<'EOF'
          Built by GitHub Actions from the merge to master.

          Both installers are unsigned: Windows SmartScreen may warn about an unknown publisher (More info > Run anyway), and on macOS the first start needs System Settings > Privacy & Security > Open Anyway.
          EOF
          args=(--target "$GITHUB_SHA" --title "Zoukan $VERSION" --notes-file notes.md --generate-notes --latest)
          if [ -n "$previous" ]; then args+=(--notes-start-tag "desktop-v$previous"); fi
          gh release create "desktop-v$VERSION" installers/*.msi installers/*.dmg installers/*.sig "${args[@]}"
