# The PR tier: parallel jobs on every pull request and every push to master, ending in one
# aggregate check, "PR gate", which is the only check branch rules need to require.
#
# Docs-only pull requests still run the workflow: the changes job finds that no code changed, the
# heavy jobs are skipped and PR gate passes, so a required check never waits forever. The docs list
# below must stay the same as desktop-build.yml's push paths-ignore, which stops docs-only merges
# from releasing.
#
# This is the fast set, and the release gate (desktop-build.yml calls it). Every pull request and
# every push to master runs the whole unit tier on Linux, Windows and macOS. The long checks (the journeys, the button crawl and the extension wiring check) do not run
# here: they run on Windows before each merge to master, `gradlew.bat :desktop:longChecks
# --continue`, and `gradlew :desktop:verifyLongChecks` checks their record before the push
# (desktop/TESTING.md, "Before merging to master"). nightly.yml runs them every night, and
# journeys.yml runs the journeys on pull requests that change the code they cover.
#
# The end-to-end tests stay out of this workflow: they only run with -Pzoukan.e2e=true, because
# they reach real extension sites. The installers are built by desktop-build.yml.
name: CI

on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/readme-images/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'desktop/reports/**'
      - 'LICENSE'
  workflow_dispatch:
  # desktop-build.yml calls this workflow, so a release waits for the check of its own commit
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Pull requests cancel their older runs; master runs queue, so every merged commit is tested
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    # Fixed image versions throughout: move them on purpose, together with RELEASING.md
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Compare with the base branch
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Pushes to master already skip docs-only commits through paths-ignore; dispatches run all
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          code=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # Same list as the paths-ignore above and desktop-build.yml
            case "$file" in
              *.md|.github/readme-images/*|.github/ISSUE_TEMPLATE/*|desktop/reports/*|LICENSE) ;;
              *) echo "Code change: $file"; code=true; break ;;
            esac
          done < <(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  spotless:
    name: Spotless
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-zoukan
        with:
          # Only master writes the shared cache, so PR runs cannot poison it
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - run: ./gradlew spotlessCheck

  # The gating unit tier on Linux. It always runs without the coverage agent, the same on pull
  # requests as on master, so a test that the instrumentation changes cannot pass one and fail the
  # other, and the test results come from and go to the build cache. Coverage is the job below.
  unit:
    name: Build and unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The coverage job's script; its own tests gate the merge, so a broken script is caught here
      - name: Changed-line coverage script tests
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: ./.github/actions/setup-zoukan
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      # distTar/distZip are built by assemble but nobody uses them in CI
      - name: Build and unit tests
        run: xvfb-run -a ./gradlew :desktop:assemble :desktop:test :extension-jvm:test :domain:desktopTest :android-compat:test :backup:desktopTest -x distTar -x distZip --continue
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: reports-unit
          path: |
            desktop/build/reports/tests/
            desktop/build/test-results/
            extension-jvm/build/reports/tests/
            domain/build/reports/tests/
            android-compat/build/reports/tests/
            backup/build/reports/tests/
          if-no-files-found: ignore

  # Pull requests only: runs the unit tier again with Kover's agent (koverXmlReportUnit) and lists
  # in the job summary the changed lines the tests do not run (desktop/TESTING.md, "Coverage"). It
  # is information only: the PR gate does not need it, and neither the job nor its steps can fail
  # the run, but a step that breaks shows as failed in the job's log.
  coverage:
    name: Coverage (information only)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The changed-line report compares with the merge base, so pull requests need the whole
          # history. The values are strings: a number 0 is falsy in an expression, so with a bare 0
          # the `||` side, 1, would always win.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: ./.github/actions/setup-zoukan
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      # The report runs the unit test tasks it measures, instrumented, and then writes the report
      - name: Coverage report
        id: kover
        continue-on-error: true
        run: xvfb-run -a ./gradlew :koverXmlReportUnit -Pzoukan.coverage=true
      # A report that cannot be made is said in the job summary and as a warning, not only in the log
      - name: Coverage of changed lines
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          KOVER_OUTCOME: ${{ steps.kover.outcome }}
        run: |
          not_computed() {
            echo "::warning title=Coverage of changed lines::$1"
            printf '### Coverage of changed lines\n\nNot computed: %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "$KOVER_OUTCOME" != "success" ]; then
            not_computed "the coverage report step did not succeed ($KOVER_OUTCOME); a failing test also stops the report (see the Build and unit tests job)."
          elif python3 -B .github/scripts/changed_line_coverage.py --base "origin/$BASE_REF" --report build/reports/kover/reportUnit.xml > "$RUNNER_TEMP/changed-lines.md"; then
            cat "$RUNNER_TEMP/changed-lines.md" >> "$GITHUB_STEP_SUMMARY"
          else
            not_computed "changed_line_coverage.py failed (see this step's log); the diff with origin/$BASE_REF may be missing."
          fi

  # The whole unit tier on the other two desktop systems, on every pull request as well as on
  # pushes to master (and so the release, which calls this workflow) and dispatches: :desktop:test,
  # :extension-jvm:test, :domain:desktopTest, :android-compat:test and :backup:desktopTest. Names
  # matched by case and Unicode form, links and Windows junctions, SQLite files, the Keychain and
  # Credential Manager, the macOS marks and the other code that only does something on Windows or
  # macOS differ from Linux, so a pull request must not first meet them after the merge. Tests for
  # one system skip themselves on the others (assumeTrue). These runners have a display, so no xvfb.
  files-os:
    name: Unit tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The same fixed images desktop-build.yml builds the installers on
        os: [windows-2025-vs2026, macos-26]
    runs-on: ${{ matrix.os }}
    # The Linux job runs the same tier and the build in about 7 minutes; these runners are slower
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-zoukan
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Unit tests
        shell: bash
        env:
          # The runner is thrown away after the job, so the Keychain tests may turn its prompts off
          ZOUKAN_KEYCHAIN_TESTS: 'true'
        run: ./gradlew :desktop:test :extension-jvm:test :domain:desktopTest :android-compat:test :backup:desktopTest --continue
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: reports-files-${{ matrix.os }}
          path: |
            desktop/build/reports/tests/
            desktop/build/test-results/
            extension-jvm/build/reports/tests/
            domain/build/reports/tests/
            android-compat/build/reports/tests/
            backup/build/reports/tests/
          if-no-files-found: ignore

  wiring:
    name: Wiring (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Injekt
            tests: '*InjektRegistrationsTest'
            artifact: injekt
          - name: Screen smoke
            tests: '*ScreenSmoke*Test'
            artifact: screen-smoke
          - name: App linkage
            tests: '*AppLinkageTest'
            artifact: app-linkage
          - name: Runtime start
            tests: '*ZoukanRuntimeStartTest'
            artifact: runtime-start
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Every wiring test class has a shard
        shell: bash
        run: |
          set -euo pipefail
          listed=$(sed -n 's/^val expectedWiringClasses = listOf(\(.*\))$/\1/p' desktop/build.gradle.kts | tr -d ' "' | tr ',' '\n')
          [ -n "$listed" ] || { echo "::error::Could not read expectedWiringClasses from desktop/build.gradle.kts"; exit 1; }
          # Match the class names literally against the shard patterns below
          set -f
          for t in $listed; do
            case "$t" in
              InjektRegistrationsTest) ;;
              ScreenSmoke*Test) ;;
              AppLinkageTest) ;;
              ZoukanRuntimeStartTest) ;;
              *) echo "::error::wiringTests lists $t but no wiring shard in ci.yml runs it"; exit 1 ;;
            esac
          done
      - uses: ./.github/actions/setup-zoukan
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - run: xvfb-run -a ./gradlew :desktop:wiringTest --tests "${{ matrix.tests }}"
      # --tests narrows the run, which turns off wiringTest's own check that every class ran
      - name: The shard ran tests
        shell: bash
        run: ls desktop/build/test-results/wiringTest/TEST-*.xml
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: reports-wiring-${{ matrix.artifact }}
          path: |
            desktop/build/reports/tests/
            desktop/build/test-results/
            desktop/build/reports/usability.md
            desktop/build/reports/usability/
          if-no-files-found: ignore

  # The desktop port edits shared Android code (app/.../data/track/, data/, domain/), so compile the
  # Android app and the Android targets of the shared modules, then run the Android app's and the
  # shared modules' Android unit tests (debug variant, on the JVM): a desktop change must not break
  # the Android build. The image's preinstalled Android SDK (ANDROID_HOME, licences already
  # accepted) has the compileSdk platform and build tools, so nothing is installed here.
  android-compile:
    name: Android compile and unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-zoukan
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Check the Android SDK
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/platforms" ] || { echo "::error::No Android SDK at ANDROID_HOME on this image"; exit 1; }
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - run: ./gradlew :app:compileDebugKotlin :data:compileDebugKotlinAndroid :domain:compileDebugKotlinAndroid :core:common:compileDebugKotlinAndroid :source-api:compileDebugKotlinAndroid
      # The only Android unit tests: the app's (src/test) and domain's (src/androidUnitTest)
      - run: ./gradlew :app:testDebugUnitTest :domain:testDebugUnitTest --continue
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: reports-android-unit
          path: |
            app/build/reports/tests/
            domain/build/reports/tests/
          if-no-files-found: ignore

  pr-gate:
    name: PR gate
    needs: [changes, spotless, unit, files-os, wiring, android-compile]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check the needed jobs
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A required job failed or was cancelled"; exit 1
          fi
          if [ "$CODE" = "true" ] && echo "$NEEDS" | jq -e '[.[].result] | any(. == "skipped")' > /dev/null; then
            echo "::error::Code changed but a job was skipped"; exit 1
          fi
          echo "PR gate passed (code changed: ${CODE:-unknown})"
