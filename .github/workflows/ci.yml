# The PR tier: parallel jobs on every pull request and every push to master, ending in one
# aggregate check, "PR gate", which is the only check branch rules need to require.
#
# Docs-only pull requests still run the workflow: the changes job finds that no code changed, the
# heavy jobs are skipped and PR gate passes, so a required check never waits forever. The docs list
# below must stay the same as desktop-build.yml's push paths-ignore, which stops docs-only merges
# from releasing.
#
# This is the fast set, and the release gate (desktop-build.yml calls it). Every pull request and
# every push to master runs the whole unit tier on Linux, Windows and macOS, plus the wiring tier
# and the Android compile and unit tests. nightly.yml runs the extension wiring check every night,
# and journeys.yml runs the journeys on pull requests that change the code they cover.
#
# The installers are built by desktop-build.yml.
name: CI

on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/readme-images/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'desktop/reports/**'
      - 'LICENSE'
  workflow_dispatch:
  # desktop-build.yml calls this workflow, so a release waits for the check of its own commit
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Pull requests cancel their older runs; master runs queue, so every merged commit is tested
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    # Fixed image versions throughout: move them on purpose, together with RELEASING.md
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Compare with the base branch
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Pushes to master already skip docs-only commits through paths-ignore; dispatches run all
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          code=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # Same list as the paths-ignore above and desktop-build.yml
            case "$file" in
              *.md|.github/readme-images/*|.github/ISSUE_TEMPLATE/*|desktop/reports/*|LICENSE) ;;
              *) echo "Code change: $file"; code=true; break ;;
            esac
          done < <(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  spotless:
    name: Spotless
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-zoukan
        with:
          # Only master writes the shared cache, so PR runs cannot poison it
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - run: ./gradlew spotlessCheck

  # The gating unit tier on Linux. It always runs without the coverage agent, the same on pull
  # requests as on master, so the test results come from and go to the build cache.
  unit:
    name: Build and unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-zoukan
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      # distTar/distZip are built by assemble but nobody uses them in CI
      - name: Build and unit tests
        run: xvfb-run -a ./gradlew :desktop:assemble :desktop:test :extension-jvm:test :domain:desktopTest :android-compat:test :backup:desktopTest :data:desktopTest :core:common:desktopTest :source-api:desktopTest -x distTar -x distZip --continue
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: reports-unit
          path: |
            desktop/build/reports/tests/
            desktop/build/test-results/
            extension-jvm/build/reports/tests/
            domain/build/reports/tests/
            android-compat/build/reports/tests/
            backup/build/reports/tests/
            data/build/reports/tests/
            core/common/build/reports/tests/
            source-api/build/reports/tests/
          if-no-files-found: ignore

  # The whole unit tier on the other two desktop systems, on every pull request as well as on
  # pushes to master (and so the release, which calls this workflow) and dispatches: :desktop:test,
  # :extension-jvm:test, :domain:desktopTest, :android-compat:test, :backup:desktopTest,
  # :data:desktopTest, :core:common:desktopTest and :source-api:desktopTest. Names
  # matched by case and Unicode form, links and Windows junctions, SQLite files, the Keychain and
  # Credential Manager, the macOS marks and the other code that only does something on Windows or
  # macOS differ from Linux, so a pull request must not first meet them after the merge. Tests for
  # one system skip themselves on the others (assumeTrue). These runners have a display, so no xvfb.
  files-os:
    name: Unit tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The same fixed images desktop-build.yml builds the installers on
        os: [windows-2025-vs2026, macos-26]
    runs-on: ${{ matrix.os }}
    # The Linux job runs the same tier and the build in about 7 minutes; these runners are slower
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-zoukan
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Unit tests
        shell: bash
        env:
          # The runner is thrown away after the job, so the Keychain tests may turn its prompts off
          ZOUKAN_KEYCHAIN_TESTS: 'true'
        run: ./gradlew :desktop:test :extension-jvm:test :domain:desktopTest :android-compat:test :backup:desktopTest :data:desktopTest :core:common:desktopTest :source-api:desktopTest --continue
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: reports-files-${{ matrix.os }}
          path: |
            desktop/build/reports/tests/
            desktop/build/test-results/
            extension-jvm/build/reports/tests/
            domain/build/reports/tests/
            android-compat/build/reports/tests/
            backup/build/reports/tests/
            data/build/reports/tests/
            core/common/build/reports/tests/
            source-api/build/reports/tests/
          if-no-files-found: ignore

  wiring:
    name: Wiring
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-zoukan
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - run: xvfb-run -a ./gradlew :desktop:wiringTest
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: reports-wiring
          path: |
            desktop/build/reports/tests/
            desktop/build/test-results/
          if-no-files-found: ignore

  # The desktop port edits shared Android code (app/.../data/track/, data/, domain/), so compile the
  # Android app and the Android targets of the shared modules, then run the Android app's and the
  # shared modules' Android unit tests (debug variant, on the JVM): a desktop change must not break
  # the Android build. The image's preinstalled Android SDK (ANDROID_HOME, licences already
  # accepted) has the compileSdk platform and build tools, so nothing is installed here.
  android-compile:
    name: Android compile and unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-zoukan
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Check the Android SDK
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/platforms" ] || { echo "::error::No Android SDK at ANDROID_HOME on this image"; exit 1; }
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - run: ./gradlew :app:compileDebugKotlin :data:compileDebugKotlinAndroid :domain:compileDebugKotlinAndroid :core:common:compileDebugKotlinAndroid :source-api:compileDebugKotlinAndroid
      # The only Android unit tests: the app's (src/test) and domain's (src/androidUnitTest)
      - run: ./gradlew :app:testDebugUnitTest :domain:testDebugUnitTest --continue
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: reports-android-unit
          path: |
            app/build/reports/tests/
            domain/build/reports/tests/
          if-no-files-found: ignore

  pr-gate:
    name: PR gate
    needs: [changes, spotless, unit, files-os, wiring, android-compile]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check the needed jobs
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A required job failed or was cancelled"; exit 1
          fi
          if [ "$CODE" = "true" ] && echo "$NEEDS" | jq -e '[.[].result] | any(. == "skipped")' > /dev/null; then
            echo "::error::Code changed but a job was skipped"; exit 1
          fi
          echo "PR gate passed (code changed: ${CODE:-unknown})"
