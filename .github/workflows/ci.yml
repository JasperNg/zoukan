# Runs the project's checks on every pull request and every push to master: the formatting check,
# the desktop build and its tests (the same command as CONTRIBUTING.md asks for before a PR).
#
# The end-to-end tests stay local: they only run with -Pzoukan.e2e=true, which this workflow never
# passes, because they reach real extension sites. The installers are built by desktop-build.yml.
name: CI

on:
  pull_request:
    paths-ignore: &docs
      - '**.md'
      - '.github/readme-images/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'desktop/reports/**'
      - 'LICENSE'
  push:
    branches: [master]
    paths-ignore: *docs
  workflow_dispatch:
  # desktop-build.yml calls this workflow, so a release waits for the check of its own commit
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Pull requests cancel their older runs; master runs queue, so every merged commit is tested
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Spotless, build and tests
    # Linux runners start and build faster than Windows ones; the Compose desktop UI tests get a
    # virtual display from xvfb-run. The installer workflow (desktop-build.yml) builds and
    # self-tests the Windows and macOS installers.
    # A fixed image version: move it on purpose, together with RELEASING.md
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # setup-java's jetbrains distribution looks the release up through the GitHub API without a
      # token, which the shared hosted-runner IPs often hit the rate limit on. Download a pinned
      # JetBrains Runtime from JetBrains' own CDN instead and hand it to setup-java as a local file,
      # as desktop-build.yml does.
      - name: Download JetBrains Runtime
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/jbrsdk-21.0.11-linux-x64-b1163.125.tar.gz" "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-21.0.11-linux-x64-b1163.125.tar.gz"
          # Pinned SHA-512 of this exact JetBrains Runtime build; change it together with the URL.
          echo "690fbea6224aeb57478f98ad56671fdbb6e927b3513555e78088f276552c554fe672705e9c6da4a65ed8279846f42e0756bae539d8282bee01f78d2fd68f846a  jbrsdk-21.0.11-linux-x64-b1163.125.tar.gz" | sha512sum -c -

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/jbrsdk-21.0.11-linux-x64-b1163.125.tar.gz
          java-version: 21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # Only master writes the shared cache, so PR runs cannot poison it
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Spotless, build and tests
        run: xvfb-run -a ./gradlew spotlessCheck :desktop:build --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-reports
          path: |
            desktop/build/reports/tests/
            desktop/build/test-results/
          if-no-files-found: ignore
