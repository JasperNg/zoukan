# Runs the project's checks on every pull request and every push to master: the formatting check,
# the desktop build and its tests (the same command as CONTRIBUTING.md asks for before a PR).
#
# The end-to-end tests stay local: they only run with -Pzoukan.e2e=true, which this workflow never
# passes, because they reach real extension sites. The installers are built by desktop-build.yml.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Spotless, build and tests
    # Windows x64 is the platform the local checks run on, and Compose desktop UI tests need a display
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          token: ${{ github.token }}

      - uses: gradle/actions/setup-gradle@v5
        with:
          # Only master writes the shared cache, so PR runs cannot poison it
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Spotless, build and tests
        shell: pwsh
        run: .\gradlew.bat spotlessCheck :desktop:build --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            desktop/build/reports/tests/
            desktop/build/test-results/
          if-no-files-found: ignore
