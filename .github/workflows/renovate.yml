# Self-hosted Renovate run on GitHub Actions. Runs daily so Dependency Dashboard checkboxes
# stay responsive; renovate.json gates regular dependency PRs to Monday UTC.
#
# Requires repository secret RENOVATE_TOKEN (a PAT scoped to this repository with Contents,
# Pull requests, Issues, and Workflows read/write permissions).
name: Renovate

on:
  # 04:47 UTC daily, away from nightly.yml (03:17 UTC) and the top of the hour
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry-run mode (none runs live)
        type: choice
        default: none
        options:
          - none
          - lookup
          - extract
          - full
      override_schedule:
        description: Ignore the schedule in renovate.json for this run
        type: boolean
        default: false
      log_level:
        description: Renovate log level
        type: choice
        default: info
        options:
          - info
          - debug

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Run Renovate
    # Forks inherit the schedule; only the main repository runs it automatically
    if: github.event_name != 'schedule' || !github.event.repository.fork
    # Fixed image version matching ci.yml and desktop-build.yml
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check Renovate token
        shell: bash
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RENOVATE_TOKEN:-}" ]; then
            echo "::error::RENOVATE_TOKEN repository secret is not set. Add a PAT scoped to this repository (Contents, Pull requests, Issues, and Workflows read/write) as RENOVATE_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-zoukan
        with:
          cache-read-only: 'true'

      - name: Check Node.js and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          node -v
          node -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major < 24 || (major === 24 && minor < 11)) {
              console.error(`::error::Node.js >= 24.11 is required for Renovate, found ${process.versions.node}`);
              process.exit(1);
            }
          '
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME/platforms" ]; then
            echo "::error::No Android SDK at ANDROID_HOME on this image"
            exit 1
          fi

      - name: Install Renovate CLI
        shell: bash
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: '44.253.1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/renovate"
          npm install --prefix "$RUNNER_TEMP/renovate" --no-audit --no-fund "renovate@${RENOVATE_VERSION}"
          "$RUNNER_TEMP/renovate/node_modules/.bin/renovate" --version

      - name: Run Renovate
        shell: bash
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          DRY_RUN: ${{ inputs.dry_run || 'none' }}
          OVERRIDE_SCHEDULE: ${{ inputs.override_schedule == true }}
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/renovate-work"
          config_file="$RUNNER_TEMP/renovate-config.json"
          mkdir -p "$work_dir"

          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg baseDir "$work_dir" \
            --arg javaHome "${JAVA_HOME:-}" \
            --arg androidHome "${ANDROID_HOME:-}" \
            --arg androidSdkRoot "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}" \
            --arg gradleUserHome "${GRADLE_USER_HOME:-$HOME/.gradle}" \
            '{
              platform: "github",
              repositories: [$repo],
              autodiscover: false,
              onboarding: false,
              requireConfig: "required",
              baseDir: $baseDir,
              platformCommit: "disabled",
              gitAuthor: "Renovate Bot <29139614+renovate[bot]@users.noreply.github.com>",
              allowedCommands: [
                "^bash \\.github/scripts/refresh-verification-metadata\\.sh$"
              ],
              customEnvVariables: {
                JAVA_HOME: $javaHome,
                ANDROID_HOME: $androidHome,
                ANDROID_SDK_ROOT: $androidSdkRoot,
                GRADLE_USER_HOME: $gradleUserHome
              }
            }' > "$config_file"

          export RENOVATE_CONFIG_FILE="$config_file"
          if [ "$DRY_RUN" != "none" ]; then
            export RENOVATE_DRY_RUN="$DRY_RUN"
          fi
          if [ "$OVERRIDE_SCHEDULE" = "true" ]; then
            export RENOVATE_FORCE='{"schedule":null}'
          fi

          "$RUNNER_TEMP/renovate/node_modules/.bin/renovate"
