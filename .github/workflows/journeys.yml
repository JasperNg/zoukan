# The offline user journeys (:desktop:journeyTest) on Windows, for pull requests that change the
# code they cover most: downloads, the built-in browser, the reader, backup and restore, the
# storage folder and the shared backup and archive modules. Other pull requests do not start it,
# so they stay as fast as ci.yml. It is not part of the PR gate and must not be a required check:
# a pull request outside these paths never runs it, so a required check would wait forever.
#
# It does not replace the long checks before a merge to master (desktop/TESTING.md, "Before
# merging to master"); it finds a broken journey earlier. The setup is the nightly's (nightly.yml).
name: Journeys

on:
  pull_request:
    paths:
      - 'desktop/src/main/kotlin/zoukan/desktop/download/**'
      - 'desktop/src/main/kotlin/zoukan/desktop/browser/**'
      - 'desktop/src/main/kotlin/zoukan/desktop/ui/reader/**'
      - 'desktop/src/main/kotlin/zoukan/desktop/ui/downloads/**'
      - 'desktop/src/main/kotlin/zoukan/desktop/backup/**'
      - 'desktop/src/main/kotlin/zoukan/desktop/storage/**'
      - 'backup/**'
      - 'core/archive/**'
      # The journeys themselves and this workflow
      - 'desktop/src/test/kotlin/zoukan/desktop/e2e/**'
      - '.github/workflows/journeys.yml'
  workflow_dispatch:

concurrency:
  group: journeys-${{ github.ref }}
  # A new push to the pull request cancels the older run
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  journeys:
    name: Journeys (windows-2025-vs2026)
    # The same fixed image as ci.yml's Windows job and the Windows installer
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-zoukan
        with:
          # Pull requests never write the shared cache
          cache-read-only: 'true'
      # A real Windows desktop, so no xvfb; journeyTest runs half the cores' worth of journeys side by side
      - run: ./gradlew :desktop:journeyTest --continue
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: journeys-windows
          retention-days: 14
          if-no-files-found: ignore
          path: |
            desktop/build/reports/journeys/
            desktop/build/reports/tests/journeyTest/
            desktop/build/test-results/journeyTest/
