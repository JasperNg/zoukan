# The nightly extension wiring check on GitHub, every night and when someone asks. On Windows and
# macOS it installs every extension of each sample store and checks it is wired up on the desktop
# (:desktop:extensionWiringTest). Nothing is packaged or signed here; desktop-build.yml makes the
# installers.
#
# It runs on master every night (only in the main repository, not in forks) and reports to the
# nightly-failure issue. It does not gate a merge or a release. Start it by hand from the Actions
# tab (Run workflow) or with `gh workflow run nightly.yml`.
name: Nightly

on:
  # 03:17 UTC, a quiet hour for the runners and away from the top of the hour, when scheduled runs pile up
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      notify:
        description: Open, update or close the nightly-failure issue for this run
        type: boolean
        default: false

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  extension-wiring:
    name: Extension wiring (${{ matrix.os }})
    # Forks inherit the schedule; only the main repository runs it
    if: github.event_name != 'schedule' || !github.event.repository.fork
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zoukan
        with:
          # The nightly never writes the shared cache
          cache-read-only: 'true'

      - name: Extension wiring
        run: ./gradlew :desktop:extensionWiringTest --continue

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-extension-wiring-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            desktop/build/reports/tests/
            desktop/build/test-results/
            desktop/build/reports/e2e/

  notify:
    name: Report to the nightly-failure issue
    needs: [extension-wiring]
    # Reports every scheduled run (main repository only), and a dispatch when it asks for it
    if: always() && ((github.event_name == 'schedule' && !github.event.repository.fork) || inputs.notify)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open, update or close the issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          WIRING: ${{ needs.extension-wiring.result }}
        run: |
          set -euo pipefail
          gh label create nightly-failure --color B60205 --description "The nightly workflow failed" 2>/dev/null || true
          issue=$(gh issue list --label nightly-failure --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ "$WIRING" = "success" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "The nightly passed again on $REF: $RUN_URL"
            fi
            echo "Nightly passed; open issue: ${issue:-none}"
            exit 0
          fi

          failed=$(gh run view "$RUN_ID" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | "- \(.name): \(.conclusion)"')
          if [ -z "$failed" ]; then
            failed="- (none listed; extension-wiring=$WIRING)"
          fi
          body=$(cat <<EOF
          The nightly failed on \`$REF\`: $RUN_URL

          Failed jobs:
          $failed

          Where to look (artifacts nightly-extension-wiring-windows-2025-vs2026, nightly-extension-wiring-macos-26):
          - Our side: the "Missing APIs" section of e2e/extensions-wiring-*.md.
          - Possibly the site: extension download errors. Re-run once before treating these as ours.
          EOF
          )
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Nightly failed" --label nightly-failure --body "$body"
          fi
