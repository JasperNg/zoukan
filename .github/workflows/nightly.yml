# The nightly tier: what the PR tier leaves out on purpose. On Windows and macOS it runs the
# full build and unit tests, the offline journeys and the extension wiring check (nightlyCheck) and
# the live end-to-end tests, which reach real sites. On ubuntu-24.04 it compares screenshots with
# the committed goldens. Nothing is packaged or signed here; desktop-build.yml makes the installers.
# Scheduled runs use the default branch.
name: Nightly

on:
  schedule:
    - cron: '0 18 * * *'   # 18:00 UTC, after the day's merges
  workflow_dispatch:
    inputs:
      notify:
        description: Open, update or close the nightly-failure issue for this run
        type: boolean
        default: false
  # Changes to this file run it on their PR, as desktop-build.yml does for itself
  pull_request:
    paths: [.github/workflows/nightly.yml]

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    name: Nightly (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-zoukan
        with:
          # The nightly never writes the shared cache
          cache-read-only: 'true'

      # The PR tier's checks on a real Windows and macOS desktop (no xvfb needed here)
      - name: Build and unit tests
        id: build
        continue-on-error: true
        run: ./gradlew :desktop:build :extension-jvm:test :domain:desktopTest --continue

      # The live run below reuses the test task's report folder, so keep this run's report
      - name: Keep the unit test report
        if: always()
        run: |
          mkdir -p desktop/build/nightly
          cp -r desktop/build/reports/tests/test desktop/build/nightly/unit-tests 2>/dev/null || true

      - name: Journeys and extension wiring
        id: nightly
        continue-on-error: true
        run: ./gradlew :desktop:nightlyCheck --continue

      - name: Live end-to-end tests
        id: live
        continue-on-error: true
        run: ./gradlew :desktop:test -Pzoukan.e2e=true --tests "*EndToEndReadTest" --tests "*EndToEndDownloadTest" --continue

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nightly-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            desktop/build/nightly/
            desktop/build/reports/tests/
            desktop/build/test-results/
            desktop/build/reports/journeys/
            desktop/build/reports/e2e/
            desktop/build/reports/usability.md

      - name: Fail if any check failed
        if: steps.build.outcome == 'failure' || steps.nightly.outcome == 'failure' || steps.live.outcome == 'failure'
        env:
          BUILD: ${{ steps.build.outcome }}
          NIGHTLY: ${{ steps.nightly.outcome }}
          LIVE: ${{ steps.live.outcome }}
        run: |
          echo "::error::build=$BUILD nightlyCheck=$NIGHTLY live=$LIVE"
          exit 1

  screenshots:
    name: Screenshots (ubuntu-24.04)
    # Pinned, not -latest: the goldens were recorded on this image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-zoukan
        with:
          cache-read-only: 'true'
      # The same fonts the goldens were recorded with (screenshots-record.yml)
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk
          fc-cache -f
      - name: Compare screenshots
        run: xvfb-run -a ./gradlew :desktop:wiringTest -Pzoukan.screenshots=verify
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nightly-screenshots
          retention-days: 14
          if-no-files-found: ignore
          path: |
            desktop/build/reports/screenshots/
            desktop/build/reports/tests/
            desktop/build/test-results/

  notify:
    name: Report to the nightly-failure issue
    needs: [nightly, screenshots]
    # Scheduled runs always report; a dispatch reports only when asked; PR runs never do
    if: always() && (github.event_name == 'schedule' || inputs.notify)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open, update or close the issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          NIGHTLY: ${{ needs.nightly.result }}
          SHOTS: ${{ needs.screenshots.result }}
        run: |
          set -euo pipefail
          gh label create nightly-failure --color B60205 --description "The nightly workflow failed" 2>/dev/null || true
          issue=$(gh issue list --label nightly-failure --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ "$NIGHTLY" = "success" ] && [ "$SHOTS" = "success" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "The nightly passed again on $REF: $RUN_URL"
            fi
            echo "Nightly passed; open issue: ${issue:-none}"
            exit 0
          fi

          failed=$(gh run view "$RUN_ID" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | "- \(.name): \(.conclusion)"')
          if [ -z "$failed" ]; then
            failed="- (none listed; nightly=$NIGHTLY, screenshots=$SHOTS)"
          fi
          body=$(cat <<EOF
          The nightly failed on \`$REF\`: $RUN_URL

          Failed jobs:
          $failed

          Where to look (artifacts nightly-windows-latest, nightly-macos-latest, nightly-screenshots):
          - Our side: unit tests (nightly/unit-tests), journeys (reports/journeys), the "Missing APIs" section of e2e/extensions-wiring.md, screenshot diffs (reports/screenshots).
          - Possibly the site: EndToEndReadTest / EndToEndDownloadTest and extension download errors. Re-run once before treating these as ours.
          EOF
          )
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Nightly failed" --label nightly-failure --body "$body"
          fi
