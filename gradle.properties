android.nonTransitiveRClass=false
android.useAndroidX=true

kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2

org.gradle.caching=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Zoukan's version floor, MAJOR.MINOR.PATCH. Releases bump PATCH over the newest desktop-v* tag;
# raise this for a new MINOR or MAJOR. Read by desktop/build.gradle.kts and desktop-build.yml.
zoukan.versionFloor=1.0.2
